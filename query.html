<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本期零用錢與帳單查詢</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    body {
      margin: 0;
      padding: 14px;
      background: #f2f5f8;
      color: #1f2937;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    .header-card {
      background: #0e6681;
      color: #fff;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(14, 102, 129, 0.16);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
    }
    .member-tag {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .controls select {
      flex: 1;
      min-width: 150px;
      height: 40px;
      padding: 0 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #0e6681;
      background: #fff;
    }
    .net-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .net-label {
      font-size: 13px;
      opacity: 0.92;
    }
    .net-amount {
      font-size: 26px;
      font-weight: 800;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .kpi {
      background: #fff;
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .kpi-title {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .kpi-val {
      font-size: 15px;
      font-weight: 700;
    }
    .pos {
      color: #047857;
    }
    .neg {
      color: #dc2626;
    }

    .section {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #0e6681;
      margin: 0 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .row-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .row-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .row-main {
      font-weight: 600;
    }
    .row-sub {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
      word-break: break-word;
    }
    .receipt-link {
      display: inline-block;
      margin-left: 8px;
      color: #0e6681;
      text-decoration: underline;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge-term {
      background: #e0f2fe;
      color: #0369a1;
    }
    .badge-ok {
      background: #dcfce7;
      color: #15803d;
    }
    .badge-wait {
      background: #fef3c7;
      color: #b45309;
    }
    .badge-rej {
      background: #fee2e2;
      color: #b91c1c;
    }
    .empty {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      padding: 12px 0;
    }
    .loading {
      text-align: center;
      padding: 40px 16px;
      color: #6b7280;
      font-size: 15px;
    }
    .back-btn {
      display: block;
      width: 100%;
      height: 44px;
      line-height: 44px;
      text-align: center;
      border-radius: 10px;
      background: #e5e7eb;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 4px;
    }
  </style>
</head>
<body>

        <div class="title">週期零用錢結算單</div>

      </div>

          <option value="盧丞菲">切換查看：盧丞菲</option>
        </select>
